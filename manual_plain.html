<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תרגיל בית 2 - חלק א</title>

    <style>
        * {
            box-sizing: border-box;
        }

        .box {
            border: 2px solid red;
            min-height: 80px;
        }

        .sideCol {
            float: left;
            width: 15%;
            height: 420px;
        }

        .mainArea {
            float: left;
            width: 85%;
            border: 2px solid red;   
            padding: 15px;
            overflow: hidden;
            height: 420px;
        }

        /* שורות – מכילות float */
        .row {
            overflow: hidden;
            margin-bottom: 10px;
        }

        /* שורה עליונה – 4 מלבנים */
        .smallCol {
            float: left;
            width: 24%;         
            min-height: 80px;
            margin-right: 1%;   
        }

        .smallCol:last-child {
            margin-right: 0;
        }

        /* שורה שנייה – שמאל: שני חצאים, ימין: מלבן גדול */
        .leftGroup {
            float: left;
            width: 39%;         
            margin-right: 1%;   
            overflow: hidden;
        }

        .rightGroup {
            float: left;
            width: 59%;         
            min-height: 160px;
        }

        /* שני חצאים */
        .halfCol {
            float: left;
            width: 100%;
            min-height: 60px;
            margin-bottom: 10px;
        }

        /* שורה שלישית – שמאל/ימין */
        .bottomLeft {
            float: left;
            width: 59%;
            min-height: 120px;
            margin-right: 1%;
        }

        .bottomRight {
            float: left;
            width: 39%;
            min-height: 120px;
        }

        /* רספונסיביות – הכול בטור אחד מתחת ל-750px */
        @media (max-width: 750px) {

            .sideCol,
            .mainArea,
            .smallCol,
            .leftGroup,
            .rightGroup,
            .bottomLeft,
            .bottomRight,
            .halfCol {
                float: none;
                width: 100%;
                margin-right: 0;
            }

            .mainArea {
                padding: 10px;
                min-height: auto;
            }

            .sideCol {
                min-height: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- עמודה צרה בצד שמאל -->
    <div class="box sideCol"></div>

    <!-- אזור המלבנים הימני (המלבן הגדול) -->
    <div class="mainArea">

        <!-- שורה עליונה: 4 מלבנים -->
        <div class="row">
            <div class="box smallCol"></div>
            <div class="box smallCol"></div>
            <div class="box smallCol"></div>
            <div class="box smallCol"></div>
        </div>

        <!-- שורה שנייה: שמאל – שני חצאים, ימין – מלבן גדול -->
        <div class="row">
            <div class="leftGroup">
                <div class="box halfCol"></div>
                <div class="box halfCol"></div>
            </div>
            <div class="box rightGroup"></div>
        </div>

        <!-- שורה שלישית: שמאל – גדול, ימין – קטן -->
        <div class="row">
            <div class="box bottomLeft"></div>
            <div class="box bottomRight"></div>
        </div>

    </div>

</body>
</html>
