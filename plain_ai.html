<!doctype html>
<html lang="he">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Layout – Plain CSS (AI Version)</title>
  <link rel="stylesheet" href="plain_ai.css">
</head>

<body>
  <div class="page-wrapper clearfix">

    <!-- סרגל צד שמאל -->
    <aside class="sidebar" aria-label="סרגל צד">
      <div class="sidebar-inner">תפריט / סיידבר</div>
    </aside>

    <!-- אזור התוכן העיקרי -->
    <main class="main" role="main">

      <!-- שורה עליונה: 4 תיבות -->
      <section class="row top-row">
        <div class="box small">1</div>
        <div class="box small">2</div>
        <div class="box small">3</div>
        <div class="box small last">4</div>
      </section>

      <!-- שורה אמצעית -->
      <section class="row middle-row">
        <div class="col left-col">
          <div class="box bar">A</div>
          <div class="box bar">B</div>
        </div>

        <div class="col right-col">
          <div class="box big-rect">C (תיבה גדולה)</div>
        </div>
      </section>

      <!-- שורה תחתונה -->
      <section class="row bottom-row">
        <div class="box wide">D</div>
        <div class="box side-small">E</div>
      </section>

    </main>

  </div>
</body>
</html>
