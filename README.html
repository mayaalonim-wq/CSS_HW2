<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תרגיל בית 2 - חלק א</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- עמודה צרה בצד שמאל -->
    <div class="box sideCol"></div>

    <!-- אזור המלבנים הימני (המלבן הגדול) -->
    <div class="mainArea">

        <!-- שורה עליונה: 4 מלבנים -->
        <div class="row">
            <div class="box smallCol"></div>
            <div class="box smallCol"></div>
            <div class="box smallCol"></div>
            <div class="box smallCol"></div>
        </div>

        <!-- שורה שנייה: שמאל – שני חצאים, ימין – מלבן גדול -->
        <div class="row">
            <div class="leftGroup">
                <div class="box halfCol"></div>
                <div class="box halfCol"></div>
            </div>
            <div class="box rightGroup"></div>
        </div>

        <!-- שורה שלישית: שמאל – גדול, ימין – קטן -->
        <div class="row">
            <div class="box bottomLeft"></div>
            <div class="box bottomRight"></div>
        </div>

    </div>


</body>
</html>
